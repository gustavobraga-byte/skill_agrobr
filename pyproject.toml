[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "agrobr-skill"
version = "1.0.0"
description = "Skill PesquisAI para dados agrícolas brasileiros — 38+ fontes públicas"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "PesquisAI", email = "contato@kdense.ai"}
]
keywords = ["brazil", "agriculture", "data", "cepea", "conab", "ibge", "skill", "pesquisai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/K-Dense-AI/scientific-agent-skills"
Repository = "https://github.com/K-Dense-AI/scientific-agent-skills"
Issues = "https://github.com/K-Dense-AI/scientific-agent-skills/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]
